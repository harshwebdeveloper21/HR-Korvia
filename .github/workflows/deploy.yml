name: Build with Docker and Deploy to cPanel via FTP
 
on:
  push:
    branches:
      - main
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build Docker Image
        run: |
          docker build -t my-app .
 
      - name: Extract Build Files from Docker
        run: |
          docker create --name temp_container my-app
          docker cp temp_container:/var/www/html ./build_output
          docker rm temp_container
 
      - name: Clean unwanted folders from build_output
        run: |
          rm -rf ./build_output/vendor
          rm -rf ./build_output/.git
          rm -f ./build_output/.gitignore
          rm -f ./build_output/.gitattributes
 
 
      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST || '145.79.212.228' }}
          username: ${{ secrets.FTP_USERNAME || 'u378554361.hr-portal.fableadtech.in' }}
          password: ${{ secrets.FTP_PASSWORD || '!FIw4bGC5yF$2J]d' }}
          server-dir: /public_html/
          local-dir: ./build_output/
          protocol: ftps
          port: 21
          dangerously-allow-untrusted-ca-certs: true
          exclude: |
            **/.git*
            **/vendor/**
            **/writable/**
            **/system/**
            **/uploads/**
            **/public/vendors/**
